name: AD Migration (Export/Import)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose run mode"
        required: true
        type: choice
        options:
          - export
          - import
      export_run_id:
        description: "Run ID of successful export (required for import)"
        required: false
        type: string

jobs:
  export:
    if: ${{ inputs.mode == 'export' }}
    runs-on: [self-hosted, Windows, X64, mgmt01]
    defaults:
      run:
        shell: powershell
    env:
      SRC_AD_HOST: ${{ secrets.SRC_AD_HOST }}
      SRC_AD_USER: ${{ secrets.SRC_AD_USER }}
      SRC_AD_PASS: ${{ secrets.SRC_AD_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare artifacts folder
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts | Out-Null

      - name: Preflight source AD connectivity
        run: |
          $ErrorActionPreference = "Stop"

          $required = @("SRC_AD_HOST","SRC_AD_USER","SRC_AD_PASS")
          foreach ($k in $required) {
            $val = (Get-Item "Env:$k" -ErrorAction SilentlyContinue).Value
            if ([string]::IsNullOrWhiteSpace($val)) {
              throw "Missing required secret: $k"
            }
          }

          $hostName = $env:SRC_AD_HOST.Trim()
          $userName = $env:SRC_AD_USER.Trim()

          Write-Host "SRC_AD_HOST: $hostName"
          Write-Host "SRC_AD_USER: $userName"

          if ($userName -notmatch '\\' -and $userName -notmatch '@') {
            throw "SRC_AD_USER must be DOMAIN\user or user@domain.tld"
          }

          try {
            Resolve-DnsName -Name $hostName -ErrorAction Stop | Out-Null
            Write-Host "DNS resolution OK"
          } catch {
            throw "DNS failed for '$hostName'. Prefer FQDN. Error: $($_.Exception.Message)"
          }

          try {
            Test-WSMan -ComputerName $hostName -ErrorAction Stop | Out-Null
            Write-Host "WinRM reachable"
          } catch {
            throw "Test-WSMan failed for '$hostName'. Error: $($_.Exception.Message)"
          }

      - name: Export AD objects from source
        run: |
          $ErrorActionPreference = "Stop"

          $hostName = $env:SRC_AD_HOST.Trim()
          $secure   = ConvertTo-SecureString $env:SRC_AD_PASS -AsPlainText -Force
          $cred     = New-Object System.Management.Automation.PSCredential($env:SRC_AD_USER, $secure)

          $session = $null
          try {
            try {
              $session = New-PSSession -ComputerName $hostName -Authentication Kerberos -Credential $cred -ErrorAction Stop
              Write-Host "Connected via Kerberos"
            } catch {
              Write-Warning "Kerberos failed: $($_.Exception.Message)"
              Write-Warning "Trying Negotiate..."
              $session = New-PSSession -ComputerName $hostName -Authentication Negotiate -Credential $cred -ErrorAction Stop
              Write-Host "Connected via Negotiate"
            }

            $exportData = Invoke-Command -Session $session -ScriptBlock {
              Import-Module ActiveDirectory -ErrorAction Stop

              # Beispiel: Users + Groups exportieren (anpassbar)
              $users = Get-ADUser -Filter * -Properties SamAccountName,UserPrincipalName,Enabled,DisplayName,GivenName,Surname,Mail,DistinguishedName |
                Select-Object SamAccountName,UserPrincipalName,Enabled,DisplayName,GivenName,Surname,Mail,DistinguishedName

              $groups = Get-ADGroup -Filter * -Properties SamAccountName,GroupCategory,GroupScope,DistinguishedName |
                Select-Object SamAccountName,GroupCategory,GroupScope,DistinguishedName

              [PSCustomObject]@{
                ExportedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
                SourceDC      = $env:COMPUTERNAME
                Users         = $users
                Groups        = $groups
              }
            }

            $jsonPath = ".\artifacts\ad-export.json"
            $exportData | ConvertTo-Json -Depth 8 | Out-File -FilePath $jsonPath -Encoding UTF8

            Write-Host "Export written to $jsonPath"
            Get-Item $jsonPath | Format-List FullName,Length,LastWriteTime
          }
          finally {
            if ($session) { Remove-PSSession $session }
          }

      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: ad-export
          path: artifacts/ad-export.json
          if-no-files-found: error

  import:
    if: ${{ inputs.mode == 'import' }}
    runs-on: [self-hosted, Windows, X64, mgmt01]
    defaults:
      run:
        shell: powershell
    env:
      DST_AD_HOST: ${{ secrets.DST_AD_HOST }}
      DST_AD_USER: ${{ secrets.DST_AD_USER }}
      DST_AD_PASSWORD: ${{ secrets.DST_AD_PASSWORD }}

    steps:
      - name: Validate import input
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace("${{ inputs.export_run_id }}")) {
            throw "For import mode, export_run_id is required."
          }

      - name: Download export artifact from run id
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ inputs.export_run_id }}
          workflow: ad-migration.yml
          name: ad-export
          path: artifacts
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifact
        run: |
          $ErrorActionPreference = "Stop"
          $file = "artifacts\ad-export.json"
          if (!(Test-Path $file)) { throw "Artifact not found: $file" }
          Get-Item $file | Format-List FullName,Length,LastWriteTime

      - name: Preflight target AD connectivity
        run: |
          $ErrorActionPreference = "Stop"

          $required = @("DST_AD_HOST","DST_AD_USER","DST_AD_PASSWORD")
          foreach ($k in $required) {
            $val = (Get-Item "Env:$k" -ErrorAction SilentlyContinue).Value
            if ([string]::IsNullOrWhiteSpace($val)) {
              throw "Missing required secret: $k"
            }
          }

          $hostName = $env:DST_AD_HOST.Trim()
          $userName = $env:DST_AD_USER.Trim()

          Write-Host "DST_AD_HOST: $hostName"
          Write-Host "DST_AD_USER: $userName"

          if ($userName -notmatch '\\' -and $userName -notmatch '@') {
            throw "DST_AD_USER must be DOMAIN\user or user@domain.tld"
          }

          Resolve-DnsName -Name $hostName -ErrorAction Stop | Out-Null
          Test-WSMan -ComputerName $hostName -ErrorAction Stop | Out-Null
          Write-Host "Target DNS + WinRM OK"

             - name: Import AD objects to target (dry-run log)
            run: |
          $ErrorActionPreference = "Stop"

          $file = "artifacts\ad-export.json"
          $data = Get-Content $file -Raw | ConvertFrom-Json

          $hostName = $env:DST_AD_HOST.Trim()
          $secure   = ConvertTo-SecureString $env:DST_AD_PASSWORD -AsPlainText -Force
          $cred     = New-Object System.Management.Automation.PSCredential($env:DST_AD_USER, $secure)

          $session = $null
          try {
            try {
              # AWS/externes Ziel: Negotiate ist der stabile Pfad
              $session = New-PSSession -ComputerName $hostName -Authentication Negotiate -Credential $cred -ErrorAction Stop
              Write-Host "Connected via Negotiate"
            } catch {
              throw "WinRM session failed (Negotiate) to '$hostName' with user '$($env:DST_AD_USER)'. Error: $($_.Exception.Message)"
            }

            # Sicherer Start: nur Zusammenfassung protokollieren
            $summary = [PSCustomObject]@{
              ImportedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
              TargetHost    = $hostName
              UsersCount    = @($data.Users).Count
              GroupsCount   = @($data.Groups).Count
              SourceDC      = $data.SourceDC
              ExportedAtUtc = $data.ExportedAtUtc
            }

            $summary | ConvertTo-Json -Depth 5 | Out-File -FilePath ".\artifacts\import-summary.json" -Encoding UTF8
            Write-Host "Dry-run summary created: artifacts\import-summary.json"

            # HIER später echte Create/Update-Logik ergänzen
          }
          finally {
            if ($session) { Remove-PSSession $session }
          }

            # Sicherer Start: nur Zusammenfassung protokollieren
            $summary = [PSCustomObject]@{
              ImportedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
              TargetHost    = $hostName
              UsersCount    = @($data.Users).Count
              GroupsCount   = @($data.Groups).Count
              SourceDC      = $data.SourceDC
              ExportedAtUtc = $data.ExportedAtUtc
            }

            $summary | ConvertTo-Json -Depth 5 | Out-File -FilePath ".\artifacts\import-summary.json" -Encoding UTF8
            Write-Host "Dry-run summary created: artifacts\import-summary.json"

            # HIER später echte Create/Update-Logik ergänzen
          }
          finally {
            if ($session) { Remove-PSSession $session }
          }

      - name: Upload import summary
        uses: actions/upload-artifact@v4
        with:
          name: ad-import-summary
          path: artifacts/import-summary.json
          if-no-files-found: error
