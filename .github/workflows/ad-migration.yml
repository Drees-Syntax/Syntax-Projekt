name: AD Migration (Export/Import)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose run mode"
        required: true
        type: choice
        options:
          - export
          - import
      export_run_id:
        description: "Run ID of successful export (required for import)"
        required: false
        type: string

jobs:
  export:
    if: ${{ inputs.mode == 'export' }}
    runs-on: [self-hosted, Windows, X64, mgmt01]
    defaults:
      run:
        shell: powershell
    env:
      SRC_AD_HOST: ${{ secrets.SRC_AD_HOST }}
      SRC_AD_USER: ${{ secrets.SRC_AD_USER }}
      SRC_AD_PASS: ${{ secrets.SRC_AD_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare artifacts folder
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts | Out-Null

      - name: Preflight source AD connectivity
        run: |
          $ErrorActionPreference = "Stop"

          $required = @("SRC_AD_HOST","SRC_AD_USER","SRC_AD_PASS")
          foreach ($k in $required) {
            $val = (Get-Item "Env:$k" -ErrorAction SilentlyContinue).Value
            if ([string]::IsNullOrWhiteSpace($val)) {
              throw "Missing required secret: $k"
            }
          }

          $hostName = $env:SRC_AD_HOST.Trim()
          $userName = $env:SRC_AD_USER.Trim()

          Write-Host "SRC_AD_HOST: $hostName"
          Write-Host "SRC_AD_USER: $userName"

          if ($userName -notmatch '\\' -and $userName -notmatch '@') {
            throw "SRC_AD_USER must be DOMAIN\user or user@domain.tld"
          }

          Resolve-DnsName -Name $hostName -ErrorAction Stop | Out-Null
          Test-WSMan -ComputerName $hostName -ErrorAction Stop | Out-Null
          Write-Host "Source DNS + WinRM OK"

      - name: Export AD objects from source
        run: |
          $ErrorActionPreference = "Stop"

          $hostName = $env:SRC_AD_HOST.Trim()
          $secure   = ConvertTo-SecureString $env:SRC_AD_PASS -AsPlainText -Force
          $cred     = New-Object System.Management.Automation.PSCredential($env:SRC_AD_USER, $secure)

          $session = $null
          try {
            try {
              $session = New-PSSession -ComputerName $hostName -Authentication Kerberos -Credential $cred -ErrorAction Stop
              Write-Host "Connected via Kerberos"
            } catch {
              Write-Warning "Kerberos failed: $($_.Exception.Message)"
              Write-Warning "Trying Negotiate..."
              $session = New-PSSession -ComputerName $hostName -Authentication Negotiate -Credential $cred -ErrorAction Stop
              Write-Host "Connected via Negotiate"
            }

            $exportData = Invoke-Command -Session $session -ScriptBlock {
              Import-Module ActiveDirectory -ErrorAction Stop

              $users = Get-ADUser -Filter * -Properties SamAccountName,UserPrincipalName,Enabled,DisplayName,GivenName,Surname,Mail,DistinguishedName |
                Select-Object SamAccountName,UserPrincipalName,Enabled,DisplayName,GivenName,Surname,Mail,DistinguishedName

              $groups = Get-ADGroup -Filter * -Properties SamAccountName,GroupCategory,GroupScope,DistinguishedName |
                Select-Object SamAccountName,GroupCategory,GroupScope,DistinguishedName

              $memberships = foreach ($g in $groups) {
                $members = Get-ADGroupMember -Identity $g.DistinguishedName -Recursive:$false -ErrorAction SilentlyContinue |
                  Where-Object { $_.objectClass -eq "user" } |
                  Select-Object -ExpandProperty SamAccountName

                [PSCustomObject]@{
                  GroupSamAccountName = $g.SamAccountName
                  MemberSamAccountNames = @($members)
                }
              }

              [PSCustomObject]@{
                ExportedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
                SourceDC      = $env:COMPUTERNAME
                Users         = @($users)
                Groups        = @($groups)
                Memberships   = @($memberships)
              }
            }

            $jsonPath = ".\artifacts\ad-export.json"
            $exportData | ConvertTo-Json -Depth 10 | Out-File -FilePath $jsonPath -Encoding UTF8

            Write-Host "Export written to $jsonPath"
            Get-Item $jsonPath | Format-List FullName,Length,LastWriteTime
          }
          finally {
            if ($session) { Remove-PSSession $session }
          }

      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: ad-export
          path: artifacts/ad-export.json
          if-no-files-found: error

  import:
    if: ${{ inputs.mode == 'import' }}
    runs-on: [self-hosted, Windows, X64, mgmt01]
    defaults:
      run:
        shell: powershell
    env:
      DST_AD_HOST: ${{ secrets.DST_AD_HOST }}
      DST_AD_USER: ${{ secrets.DST_AD_USER }}
      DST_AD_PASSWORD: ${{ secrets.DST_AD_PASSWORD }}
      AD_IMPORT_APPLY: ${{ secrets.AD_IMPORT_APPLY }}

    steps:
      - name: Validate import input
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace("${{ inputs.export_run_id }}")) {
            throw "For import mode, export_run_id is required."
          }

      - name: Download export artifact from run id
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ inputs.export_run_id }}
          workflow: ad-migration.yml
          name: ad-export
          path: artifacts
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifact
        run: |
          $ErrorActionPreference = "Stop"
          $file = "artifacts\ad-export.json"
          if (!(Test-Path $file)) { throw "Artifact not found: $file" }
          Get-Item $file | Format-List FullName,Length,LastWriteTime

      - name: Preflight target AD connectivity
        run: |
          $ErrorActionPreference = "Stop"

          $required = @("DST_AD_HOST","DST_AD_USER","DST_AD_PASSWORD")
          foreach ($k in $required) {
            $val = (Get-Item "Env:$k" -ErrorAction SilentlyContinue).Value
            if ([string]::IsNullOrWhiteSpace($val)) {
              throw "Missing required secret: $k"
            }
          }

          $hostName = $env:DST_AD_HOST.Trim()
          $userName = $env:DST_AD_USER.Trim()

          Write-Host "DST_AD_HOST: $hostName"
          Write-Host "DST_AD_USER: $userName"

          if ($userName -notmatch '\\' -and $userName -notmatch '@') {
            throw "DST_AD_USER must be DOMAIN\user or user@domain.tld"
          }

          Resolve-DnsName -Name $hostName -ErrorAction Stop | Out-Null
          Write-Host "DNS OK"

          $tcp = Test-NetConnection -ComputerName $hostName -Port 5985 -WarningAction SilentlyContinue
          if (-not $tcp.TcpTestSucceeded) {
            throw "Port 5985 not reachable on $hostName"
          }
          Write-Host "WinRM port 5985 OK"

      - name: Import AD objects to target
        run: |
          $ErrorActionPreference = "Stop"

          # Safety switch: default = simulation
          # Set secret AD_IMPORT_APPLY=true for real writes
          $apply = ($env:AD_IMPORT_APPLY -eq "true")
          Write-Host "APPLY MODE: $apply"

          $file = "artifacts\ad-export.json"

          Add-Type -AssemblyName System.Web.Extensions
          $ser = New-Object System.Web.Script.Serialization.JavaScriptSerializer
          $ser.MaxJsonLength = [int]::MaxValue
          $data = $ser.DeserializeObject((Get-Content $file -Raw))

          $hostName = $env:DST_AD_HOST.Trim()
          $secure   = ConvertTo-SecureString $env:DST_AD_PASSWORD -AsPlainText -Force
          $cred     = New-Object System.Management.Automation.PSCredential($env:DST_AD_USER.Trim(), $secure)

          $session = $null
          try {
            $session = New-PSSession -ComputerName $hostName -Authentication Negotiate -Credential $cred -ErrorAction Stop
            Write-Host "Connected via Negotiate"

            $result = Invoke-Command -Session $session -ArgumentList @($data, $apply) -ScriptBlock {
              param($data, $apply)

              Import-Module ActiveDirectory -ErrorAction Stop

              $targetUserOu  = (Get-ADDomain).UsersContainer
              $targetGroupOu = (Get-ADDomain).UsersContainer
              $targetDns     = (Get-ADDomain).DNSRoot

              $stats = [ordered]@{
                UsersCreated       = 0
                UsersUpdated       = 0
                GroupsCreated      = 0
                MembershipsAdded   = 0
                MembershipsSkipped = 0
                Warnings           = @()
              }

              function To-Bool($v) {
                if ($null -eq $v) { return $false }
                return [System.Convert]::ToBoolean($v)
              }

              # GROUPS
              $groups = @($data["Groups"])
              foreach ($g in $groups) {
                $sam = $g["SamAccountName"]
                if ([string]::IsNullOrWhiteSpace($sam)) { continue }

                $existing = Get-ADGroup -Filter "SamAccountName -eq '$sam'" -ErrorAction SilentlyContinue
                if (-not $existing) {
                  $scope = "$($g["GroupScope"])"
                  $cat   = "$($g["GroupCategory"])"
                  if ([string]::IsNullOrWhiteSpace($scope)) { $scope = "Global" }
                  if ([string]::IsNullOrWhiteSpace($cat))   { $cat = "Security" }

                  if ($apply) {
                    New-ADGroup `
                      -Name $sam `
                      -SamAccountName $sam `
                      -GroupScope $scope `
                      -GroupCategory $cat `
                      -Path $targetGroupOu `
                      -ErrorAction Stop | Out-Null
                  }
                  $stats.GroupsCreated++
                }
              }

              # USERS
              $users = @($data["Users"])
              foreach ($u in $users) {
                $sam = $u["SamAccountName"]
                if ([string]::IsNullOrWhiteSpace($sam)) { continue }

                $display = $u["DisplayName"]
                $given   = $u["GivenName"]
                $surname = $u["Surname"]
                $mail    = $u["Mail"]
                $upnIn   = $u["UserPrincipalName"]
                $enabled = To-Bool $u["Enabled"]

                if (-not [string]::IsNullOrWhiteSpace($upnIn) -and $upnIn -like "*@*") {
                  $prefix = $upnIn.Split("@")[0]
                  $upn = "$prefix@$targetDns"
                } else {
                  $upn = "$sam@$targetDns"
                }

                $existing = Get-ADUser -Filter "SamAccountName -eq '$sam'" -Properties Enabled -ErrorAction SilentlyContinue
                if (-not $existing) {
                  $initPwd = ConvertTo-SecureString "ChangeMe!12345" -AsPlainText -Force

                  if ($apply) {
                    New-ADUser `
                      -Name ($(if ($display) { $display } else { $sam })) `
                      -SamAccountName $sam `
                      -UserPrincipalName $upn `
                      -DisplayName $display `
                      -GivenName $given `
                      -Surname $surname `
                      -EmailAddress $mail `
                      -Path $targetUserOu `
                      -AccountPassword $initPwd `
                      -Enabled:$enabled `
                      -ChangePasswordAtLogon $true `
                      -ErrorAction Stop
                  }
                  $stats.UsersCreated++
                }
                else {
                  if ($apply) {
                    Set-ADUser -Identity $existing `
                      -UserPrincipalName $upn `
                      -DisplayName $display `
                      -GivenName $given `
                      -Surname $surname `
                      -EmailAddress $mail `
                      -ErrorAction Stop

                    if ($enabled -and -not $existing.Enabled) { Enable-ADAccount -Identity $existing -ErrorAction Stop }
                    if (-not $enabled -and $existing.Enabled) { Disable-ADAccount -Identity $existing -ErrorAction Stop }
                  }
                  $stats.UsersUpdated++
                }
              }

              # MEMBERSHIPS
              $memberships = @($data["Memberships"])
              foreach ($m in $memberships) {
                $groupSam = $m["GroupSamAccountName"]
                if ([string]::IsNullOrWhiteSpace($groupSam)) { continue }

                $group = Get-ADGroup -Filter "SamAccountName -eq '$groupSam'" -ErrorAction SilentlyContinue
                if (-not $group) {
                  $stats.MembershipsSkipped++
                  $stats.Warnings += "Group not found in target: $groupSam"
                  continue
                }

                $memberSams = @($m["MemberSamAccountNames"])
                foreach ($memberSam in $memberSams) {
                  if ([string]::IsNullOrWhiteSpace($memberSam)) { continue }

                  $user = Get-ADUser -Filter "SamAccountName -eq '$memberSam'" -ErrorAction SilentlyContinue
                  if (-not $user) {
                    $stats.MembershipsSkipped++
                    $stats.Warnings += "User not found for membership: $memberSam (group $groupSam)"
                    continue
                  }

                  $alreadyMember = $false
                  try {
                    $alreadyMember = Get-ADGroupMember -Identity $group.DistinguishedName -Recursive:$false -ErrorAction Stop |
                      Where-Object { $_.DistinguishedName -eq $user.DistinguishedName } |
                      ForEach-Object { $true } |
                      Select-Object -First 1
                  } catch {}

                  if (-not $alreadyMember) {
                    if ($apply) {
                      Add-ADGroupMember -Identity $group.DistinguishedName -Members $user.DistinguishedName -ErrorAction Stop
                    }
                    $stats.MembershipsAdded++
                  }
                }
              }

              [PSCustomObject]$stats
            }

            $summary = [PSCustomObject]@{
              ImportedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
              TargetHost    = $hostName
              ApplyMode     = $apply
              SourceDC      = $data["SourceDC"]
              ExportedAtUtc = $data["ExportedAtUtc"]
              UsersCount    = @($data["Users"]).Count
              GroupsCount   = @($data["Groups"]).Count
              MembershipsCount = @($data["Memberships"]).Count
              Result        = $result
            }

            $summary | ConvertTo-Json -Depth 10 | Out-File -FilePath ".\artifacts\import-summary.json" -Encoding UTF8
            Write-Host "Import summary created: artifacts\import-summary.json"
          }
          finally {
            if ($session) { Remove-PSSession $session }
          }

      - name: Upload import summary
        uses: actions/upload-artifact@v4
        with:
          name: ad-import-summary
          path: artifacts/import-summary.json
          if-no-files-found: error
